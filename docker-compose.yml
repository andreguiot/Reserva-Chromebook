version: '3.8'

services:
  api:
    build: .
    container_name: reserva_api
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/reservas_db
    command: npm run dev
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: reserva_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: reservas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: reserva_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  pgdata:
