<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - La Salle Abel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="login-left">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i></a>

        <h1>Bem-Vindo(a)</h1>

        <div id="msg-erro-login" class="msg-erro-card"></div>
        <div id="msg-sucesso-login" class="msg-sucesso-card"></div>

        <form id="form-login-local">
            <div class="input-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user icon-left"></i>
                    <input type="email" id="email" placeholder="E-mail institucional (@lasalle.org.br)" required>
                </div>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="senha" placeholder="Sua senha" required>
                    <i class="fa-regular fa-eye-slash icon-right" id="toggle-senha"></i>
                </div>
            </div>

            <div class="options-row">
                <label class="checkbox-group">
                    <input type="checkbox" id="manter-conectado"> Mantenha-me conectado
                </label>
                <a href="#" class="forgot-pwd">Esqueci minha senha</a>
            </div>

            <button type="submit" class="btn-primary">Login</button>
        </form>

        <div class="divider">ou</div>

        <div class="google-btn-wrapper">
            <div id="g_id_onload"
                data-client_id="803873738013-ihgv3tp0d44uqn1ei5iemasa3rvdklnh.apps.googleusercontent.com"
                data-context="signin" data-ux_mode="popup" data-callback="handleGoogleLogin" data-auto_prompt="false">
            </div>
            <div class="g_id_signin flex-center" data-type="standard" data-shape="rectangular" data-theme="outline"
                data-text="signin_with" data-size="large" data-logo_alignment="left">
            </div>
        </div>
    </div>

    <!-- Coluna Direita: Branding -->
    <div class="login-right">
        <img src="images/lasallevertical.webp" alt="Logo La Salle Abel">
    </div>
    <script src="js/login.js"></script>
</body>

</html>
