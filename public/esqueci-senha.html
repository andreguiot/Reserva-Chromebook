<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - La Salle Abel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="login-left">
        <a href="logintela.html" class="back-link"><i class="fa-solid fa-arrow-left"></i></a>

        <h1>Redefinir Senha</h1>

        <div id="msg-erro-login" class="msg-erro-card"></div>

        <div style="background-color: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; padding: 14px; border-radius: 6px; font-size: 0.95rem; text-align: center; margin-bottom: 2rem;">
            <i class="fa-solid fa-info-circle"></i> Logue-se pelo Google e redefina sua senha
        </div>

        <!-- Formulário: Definir Nova Senha (aparece após Google login) -->
        <form id="form-definir-senha" class="d-none">
            <div class="input-group">
                <label for="nova-senha">Nova Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="nova-senha" placeholder="Mínimo 8 caracteres" required>
                    <i class="fa-regular fa-eye-slash icon-right" id="toggle-nova-senha"></i>
                </div>
            </div>
            <div class="input-group">
                <label for="confirmar-senha">Confirmar Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmar-senha" placeholder="Repita a senha" required>
                    <i class="fa-regular fa-eye-slash icon-right" id="toggle-confirmar-senha"></i>
                </div>
            </div>
            <button type="submit" class="btn-primary">Salvar Nova Senha</button>
        </form>

        <div class="google-btn-wrapper" id="google-btn-wrapper">
            <div id="g_id_onload"
                data-client_id="803873738013-ihgv3tp0d44uqn1ei5iemasa3rvdklnh.apps.googleusercontent.com"
                data-context="signin" data-ux_mode="popup" data-callback="handleGoogleLogin" data-auto_prompt="false">
            </div>
            <div class="g_id_signin flex-center" data-type="standard" data-shape="rectangular" data-theme="outline"
                data-text="signin_with" data-size="large" data-logo_alignment="left">
            </div>
        </div>
    </div>

    <!-- Coluna Direita: Branding -->
    <div class="login-right">
        <img src="images/lasallevertical.webp" alt="Logo La Salle Abel">
        <h2 class="branding-title">Reserva de ChromeBooks</h2>
    </div>
    <script src="js/esqueci-senha.js"></script>
</body>

</html>
