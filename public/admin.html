<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - La Salle Abel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <!-- SDK do Google Identity -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <div class="login-card">
        <img src="images/logo-abel.png" alt="La Salle Abel" class="login-logo">

        <h1 class="login-title">Acesso Administrativo</h1>
        <p class="login-subtitle">Acesso restrito para funcionários.</p>

        <!-- Configuração do Google Identity -->
        <div id="g_id_onload" data-client_id="803873738013-ihgv3tp0d44uqn1ei5iemasa3rvdklnh.apps.googleusercontent.com" data-context="signin" data-ux_mode="popup"
            data-callback="handleCredentialResponse" data-auto_prompt="false">
        </div>

        <!-- Botão Visual do Google -->
        <div class="g_id_signin flex-center m-y-20" data-type="standard"
            data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large"
            data-logo_alignment="left">
        </div>

        <div id="erro-login" class="d-none text-danger m-b-15 text-center">Acesso negado.
        </div>

        <a href="index.html" class="footer-link">&larr; Voltar para Reservas</a>
    </div>

    <script src="js/auth.js"></script>
</body>

</html>
